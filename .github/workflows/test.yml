name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read  # PR number/title for the Slack message
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - id: lint
        run: ruff check .
      - id: tests
        run: pytest

      # Needs a SLACK_WEBHOOK_URL repo secret; skips quietly without it.
      # Push events only, so a PR branch doesn't get two messages per push.
      - name: Notify Slack
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          KIND: test
          STATUS: ${{ job.status }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: python .github/scripts/slack_notify.py

